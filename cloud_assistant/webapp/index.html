<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud Ops Assistant — Run</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand"><span class="dot"></span> Cloud Ops Assistant</div>
    <nav class="tabs">
      <a href="/" class="active">Run</a>
      <a href="/logs">History</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <h2>Send a request to the graph</h2>
    <div class="field">
      <label for="request">Request</label>
      <textarea id="request" rows="3" placeholder="e.g. Audit account 333333333333 for public S3 buckets and over-permissioned IAM roles."></textarea>
    </div>
    <div class="field-row">
      <div class="field" style="margin-bottom:0">
        <label for="account_id">Account id (optional)</label>
        <input id="account_id" type="text" placeholder="leave blank to let the supervisor decide">
      </div>
      <div class="field" style="margin-bottom:0">
        <label>&nbsp;</label>
        <button class="primary" id="run-btn" type="button">Run</button>
      </div>
    </div>
    <div id="scenario-pills" class="pills"></div>
    <p class="hint" id="run-status"></p>
  </div>

  <div class="card" id="result-card" style="display:none">
    <h2>Result</h2>
    <div id="result-body"></div>
  </div>
</div>

<script src="/static/app.js"></script>
<script src="/static/run.js"></script>
</body>
</html>
